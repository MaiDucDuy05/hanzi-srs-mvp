services:
  postgres:
    image: postgres:16-alpine
    container_name: hanzi-postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 500M
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hanzi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hanzi_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-hanzi_srs}
    volumes:
      - hanzi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hanzi} -d ${POSTGRES_DB:-hanzi_srs}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hanzi-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: hanzi-api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-hanzi}:${POSTGRES_PASSWORD:-hanzi_dev_password}@postgres:5432/${POSTGRES_DB:-hanzi_srs}
      - REDIS_URL=redis://redis:6379
      - PORT=8000
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  hanzi_pgdata:

